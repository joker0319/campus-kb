services:
  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    image: campus-kb:local
    restart: unless-stopped
    # 只暴露给同网络内的 nginx，公网无法直连后端的无鉴权接口
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 30s
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在根目录 .env 中填入 DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      CAMPUS_EMBEDDING: ${CAMPUS_EMBEDDING:-auto}
      CAMPUS_EMBEDDING_MODEL: ${CAMPUS_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      CAMPUS_ALLOW_ORIGINS: ${CAMPUS_ALLOW_ORIGINS:-}
      CAMPUS_CORPUS_DIR: /app/corpus/text
      CAMPUS_INDEX_DIR: /app/corpus/.index
      CAMPUS_SESSION_DIR: /app/data/sessions
    volumes:
      # 93 份文本语料（只读）
      - ./campus-kb/corpus/text:/app/corpus/text:ro
      # 向量索引需可写：语料更新后会在容器内重建
      - ./campus-kb/corpus/.index:/app/corpus/.index
      # 对话记忆需可写：容器重建后仍能接着上次会话
      - ./campus-kb/data/sessions:/app/data/sessions
      # 只挂图注元数据，不挂 691MB 原图；前端按既定方案显示占位
      - ./campus-kb/corpus/images/INDEX.json:/app/corpus/images/INDEX.json:ro
      - ./campus-kb/corpus/images/captions.json:/app/corpus/images/captions.json:ro
      - ./campus-kb/corpus/INDEX.md:/app/corpus/INDEX.md:ro
      - ./campus-kb/corpus/wechat-sources.json:/app/corpus/wechat-sources.json:ro
      # ONNX 模型缓存持久化，避免每次重建容器重新下载约 95MB
      - campus-hf-cache:/home/appuser/.cache

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: campus-portal-web:local
    restart: unless-stopped
    ports:
      - "${CAMPUS_HTTP_PORT:-8080}:80"
    environment:
      CAMPUS_BASIC_USER: ${CAMPUS_BASIC_USER:?请在根目录 .env 中填入 CAMPUS_BASIC_USER}
      CAMPUS_BASIC_PASSWORD: ${CAMPUS_BASIC_PASSWORD:?请在根目录 .env 中填入 CAMPUS_BASIC_PASSWORD}
    depends_on:
      api:
        condition: service_healthy

volumes:
  campus-hf-cache:

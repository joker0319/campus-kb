[project]
name = "campus-kb-api"
version = "0.1.0"
description = "校园投稿质量门 API：FastAPI 封装 checker.py 规则引擎"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 系统临时目录在沙箱/CI 里可能不可建（pytest-of-root 触发 FileExistsError），
# basetemp 固定到项目内相对目录，pytest 每次自行清理，且已在 .gitignore 排除。
addopts = "--basetemp=.pytest_tmp"

[tool.pyright]
include = ["api", "checker.py"]
typeCheckingMode = "strict"

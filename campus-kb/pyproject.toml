[project]
name = "campus-kb-api"
version = "0.1.0"
description = "校园投稿质量门 API：FastAPI 封装 checker.py 规则引擎"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 系统临时目录在沙箱/CI 里可能不可建（pytest-of-root 触发 FileExistsError），
# basetemp 固定到项目内相对目录，pytest 每次自行清理，且已在 .gitignore 排除。
# xdist 下每个 worker 会自动分到 .pytest_tmp/popen-gw<N>/，tmp_path 天然隔离。
addopts = "--basetemp=.pytest_tmp"
# 并行需显式开：pytest -n 4。196 个用例全为毫秒级（最慢 0.12s），
# 实测串行 1.1s、-n 4 为 1.8s、-n auto 为 3.5s——worker 启动开销大于收益，
# 故不写进 addopts；待出现百毫秒级以上的慢用例再默认开启。

[tool.pyright]
include = ["api", "checker.py"]
typeCheckingMode = "strict"

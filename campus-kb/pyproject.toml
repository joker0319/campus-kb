[project]
name = "campus-kb-api"
version = "0.1.0"
description = "校园投稿质量门 API：FastAPI 封装 checker.py 规则引擎"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 系统临时目录在沙箱/CI 里可能不可建（pytest-of-root 触发 FileExistsError），
# basetemp 固定到项目内相对目录，pytest 每次自行清理，且已在 .gitignore 排除。
# xdist 下每个 worker 会自动分到 .pytest_tmp/popen-gw<N>/，tmp_path 天然隔离。
# 默认并行 4 worker；单例调试或接入 pdb 时用 `pytest -n 0` 退回串行。
# 注：当前 196 个用例全为毫秒级（最慢 0.12s），串行 1.1s 反而快于并行 1.8s，
# 默认并行是为后续慢用例（真实嵌入/模型调用）预留；嫌慢可显式 -n 0。
addopts = "--basetemp=.pytest_tmp -n 4"

[tool.pyright]
include = ["api", "checker.py"]
typeCheckingMode = "strict"

# 证书申请前的 HTTP 引导模式：只监听 80，开放 ACME webroot 校验，其余功能照常。
# __DOMAIN__ 由 entrypoint.sh 按 CAMPUS_DOMAIN 替换，不写死域名。
limit_req_zone $binary_remote_addr zone=campus_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=campus_ai:10m rate=6r/m;

server {
    listen 80;
    server_name __DOMAIN__;
    root /usr/share/nginx/html;
    index index.html;

    # 引导期同样要鉴权：申请证书的那几分钟也不能裸奔
    auth_basic "Campus Knowledge Base";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # certbot --webroot 把校验文件写进共享卷，必须放在最前面。
    # Let's Encrypt 校验请求不会带 Basic Auth 凭据，此路径必须免鉴权。
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    include /etc/nginx/locations.rendered;
}

# nginx server 块的公共部分：HTTP 引导与 HTTPS 两种模式共用，避免两处漂移。
client_max_body_size 21m;   # 后端 review-file 上限 20MB
access_log /dev/stdout;
error_log /dev/stderr warn;

gzip on;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

# 生成类接口按 IP 限流，防止刷 DeepSeek 额度
location ~ ^/api/(?:compose|agent|chat|pipeline)(?:/|$) {
    limit_req zone=campus_ai burst=2 nodelay;
    limit_req_status 429;
    include /etc/nginx/api_proxy.conf;
}

# 检索 / 校验 / 配图等普通接口
location /api/ {
    limit_req zone=campus_api burst=20 nodelay;
    limit_req_status 429;
    include /etc/nginx/api_proxy.conf;
}

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    __HSTS__   # 由 entrypoint 渲染：仅 HTTPS 模式注入，避免覆盖 server 级指令
    try_files $uri =404;
}

location = /index.html {
    add_header Cache-Control "no-cache";
    __HSTS__
}

# Vite 产物为相对路径 + hash 路由，回退 index.html 即可
location / {
    try_files $uri $uri/ /index.html;
}

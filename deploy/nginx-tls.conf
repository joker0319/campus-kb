# 证书就绪后的 HTTPS 模式：80 仅做 ACME 校验 + 跳转，443 承载整站。
# __DOMAIN__ 由 entrypoint.sh 按 CAMPUS_DOMAIN 替换。
limit_req_zone $binary_remote_addr zone=campus_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=campus_ai:10m rate=6r/m;

server {
    listen 80;
    server_name __DOMAIN__;

    # 续期走 webroot，必须保持 80 可访问（不能被 301 吞掉，也不能要密码）
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 整站 Basic Auth（同源 fetch 自动带凭据），与 HTTP 引导模式一致
    auth_basic "Campus Knowledge Base";
    auth_basic_user_file /etc/nginx/.htpasswd;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/locations.rendered;
}

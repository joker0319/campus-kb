# 公网唯一入口：静态站 + /api 反代。后端容器不暴露端口，只能从这里进来。
limit_req_zone $binary_remote_addr zone=campus_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=campus_ai:10m rate=6r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 整站（含 /api）统一 Basic Auth；同源 fetch 自动带凭据
    auth_basic "Campus Knowledge Base";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 21m;   # 后端 review-file 上限 20MB
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 生成类接口按 IP 限流，防止刷 DeepSeek 额度
    location ~ ^/api/(?:compose|agent|chat)(?:/|$) {
        limit_req zone=campus_ai burst=2 nodelay;
        limit_req_status 429;
        include /etc/nginx/api_proxy.conf;
    }

    # 检索 / 校验 / 配图等普通接口
    location /api/ {
        limit_req zone=campus_api burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/api_proxy.conf;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite 产物为相对路径 + hash 路由，回退 index.html 即可
    location / {
        try_files $uri $uri/ /index.html;
    }
}
